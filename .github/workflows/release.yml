name: Release Please

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and upload (vX.Y.Z); blank builds artifacts only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.sha }}
          persist-credentials: false
      - name: Validate the release tag and version
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v$VERSION"
          gh release view "$RELEASE_TAG" > /dev/null
      - name: Build the documented environment
        run: docker build -f docker/Dockerfile -t campus-beamer:release .
      - name: Test and build the public release bundle
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$(pwd),dst=/workspace" \
            campus-beamer:release make release
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: campus-beamer-release
          path: build/releases/campus-beamer-v*-release.zip
          if-no-files-found: error
          retention-days: 14
      - name: Attach the bundle and notices to the GitHub Release
        if: env.RELEASE_TAG != ''
        run: |
          BUNDLE="build/releases/campus-beamer-${RELEASE_TAG}-release.zip"
          unzip -p "$BUNDLE" RELEASE_NOTES.md > build/releases/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" "$BUNDLE" --clobber
          gh release edit "$RELEASE_TAG" --notes-file build/releases/RELEASE_NOTES.md
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            build/*.log
            build/*.blg
            build/draft/example/report.*
          if-no-files-found: ignore
